<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volci.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #ecf0f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        h1 {
            color: #e94560;
            margin: 0;
            font-size: 2.5rem;
        }
        p.tagline {
            font-style: italic;
            color: #95a5a6;
            margin-top: 10px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }
        .track {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #e94560;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .track-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: block;
        }
        audio {
            width: 100%;
            margin-top: 10px;
            outline: none;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Volci. Music</h1>
        <p class="tagline">Simply Gat</p>
    </header>

    <div class="container">
        <!-- Driving Notes -->
        <div class="track">
            <span class="track-title">Song Title 1</span>
            <!-- The player is there, but it has no song yet -->
            <audio controls></audio>
        </div>

        <!-- Wama Lamma -->
        <div class="track">
            <span class="track-title">Song Title 2</span>
            <audio controls></audio>
        </div>

        <!-- Graph Lines -->
        <div class="track">
            <span class="track-title">Song Title 3</span>
            <audio controls></audio>
        </div>
    </div>

    <footer>
        <p>Hosted via GitHub Pages</p>
    </footer>

</body>
</html>
